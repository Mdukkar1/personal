<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Daily Desk · আমার দিনলিপি</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atma:wght@400;600&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ee;--card:#fff;--tx:#2b2a33;--mut:#7a7686;--ac:#e0603a;--ac2:#2f7d6d;--ln:#e8e0d0;--sh:0 2px 10px #0001}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17161c;--card:#22212a;--tx:#f0eee8;--mut:#a09cae;--ac:#ff8a5f;--ac2:#5cc4ae;--ln:#37353f;--sh:0 2px 10px #0006}}
:root[data-theme="dark"]{--bg:#17161c;--card:#22212a;--tx:#f0eee8;--mut:#a09cae;--ac:#ff8a5f;--ac2:#5cc4ae;--ln:#37353f;--sh:0 2px 10px #0006}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,sans-serif;line-height:1.5}
main{max-width:860px;margin:auto;padding:12px 14px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font:700 1.5rem Kalam,"Atma",cursive;margin:6px 0}
#clk{font:700 1.6rem Kalam,monospace;color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 14px;font:inherit;cursor:pointer;white-space:nowrap;transition:.15s}
nav button.on,.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn:hover,nav button:hover{transform:translateY(-1px)}
.btn.g{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.card h2{margin:0 0 8px;font-size:1.05rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:7px 10px;max-width:100%}
.grow{flex:1;min-width:120px}
.mut{color:var(--mut);font-size:.85rem}
.big{font:700 2.4rem Kalam,monospace;text-align:center}
.tl{display:flex;gap:10px;padding:8px 10px;border-left:4px solid var(--c,var(--ln));margin:6px 0;background:var(--bg);border-radius:0 10px 10px 0;align-items:center}
.tl.now{box-shadow:0 0 0 2px var(--ac);animation:pl 2s infinite}
.tl.done{opacity:.5;text-decoration:line-through}
@keyframes pl{50%{box-shadow:0 0 0 5px #e0603a33}}
.bar{height:14px;border-radius:7px;background:var(--c);min-width:3px;transition:width .5s}
.pg{height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ac2);transition:width .5s}
.tk{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--ln)}
.tk.d span.t{text-decoration:line-through;opacity:.5}
.chip{font-size:.72rem;padding:1px 8px;border-radius:10px;background:var(--c);color:#fff}
#paper{width:100%;min-height:340px;font-size:1.35rem;line-height:2rem;border-radius:12px;background:repeating-linear-gradient(transparent 0 calc(2rem - 1px),#9ab 0 2rem),#fffdf5;color:#2b2a33;border:1px solid var(--ln);padding:4px 14px}
.f-kalam{font-family:Kalam,"Atma",cursive}.f-atma{font-family:Atma,Kalam,cursive}.f-hind{font-family:"Hind Siliguri",sans-serif}
#ring{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50}
#ring div{background:var(--card);padding:26px;border-radius:20px;text-align:center;max-width:90%;animation:sh .4s infinite}
@keyframes sh{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
#pa{display:none}
@media (max-width:640px){nav{position:fixed;top:auto;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);box-shadow:0 -2px 10px #0002}nav button{padding:9px 12px;font-size:.85rem}main{padding-bottom:110px}input,select,textarea{font-size:16px}}
@media print{body>*:not(#pa){display:none!important}#pa{display:block!important;color:#000;background:#fff;padding:20px}#pa .ln{background:repeating-linear-gradient(transparent 0 calc(2rem - 1px),#9ab 0 2rem);line-height:2rem;font-size:1.3rem;white-space:pre-wrap;min-height:70vh}}
#mic{position:fixed;right:12px;bottom:92px;z-index:20;display:flex;gap:6px}#mic button{border:0;border-radius:50%;width:52px;height:52px;font-size:1.4rem;background:var(--ac);color:#fff;box-shadow:var(--sh);cursor:pointer}#mic button+button{width:40px;height:40px;font-size:.8rem;background:var(--ac2);align-self:flex-end}
.ban{background:linear-gradient(120deg,var(--ac),var(--ac2));color:#fff;border-radius:16px;padding:12px 14px;margin:10px 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}.gal img{width:100%;height:110px;object-fit:cover;border-radius:10px;cursor:zoom-in}
table{width:100%;border-collapse:collapse}td{padding:5px;border-bottom:1px dashed var(--ln)}
body{font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif}
h1,h2{font-family:"Playfair Display","Noto Serif Bengali",serif;letter-spacing:.2px}
h1{font-size:1.7rem;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#clk,.big{font-family:"Space Grotesk",monospace;font-weight:700}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 20% 20%,var(--b1,#e0603a33),transparent 40%),radial-gradient(circle at 80% 30%,var(--b2,#2f7d6d33),transparent 40%),radial-gradient(circle at 50% 90%,var(--b1,#e0603a22),transparent 45%);animation:fl 18s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(4%,3%) rotate(6deg) scale(1.1)}}
.card{position:relative;overflow:hidden;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--card) 84%,transparent);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #0002}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,50%) var(--my,-40%),color-mix(in srgb,var(--ac) 14%,transparent),transparent 60%);opacity:0;transition:.3s;pointer-events:none}.card:hover::before{opacity:1}
.rv{animation:rv .55s both cubic-bezier(.2,.8,.2,1)}@keyframes rv{from{opacity:0;transform:translateY(16px) scale(.98)}}
.btn,nav button{position:relative;overflow:hidden}.btn:active,nav button:active{transform:scale(.94)}
.btn.p,nav button.on{background:linear-gradient(135deg,var(--ac),#f2a65a);border-color:transparent;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 40%,transparent)}
.rp{position:absolute;border-radius:50%;background:#fff6;transform:scale(0);animation:rp .6s forwards;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.3s;flex:none}
nav button{display:flex;align-items:center;gap:7px}nav button small{display:block;font-size:.65rem;opacity:.75;line-height:1.1}
nav button:hover .ic{transform:translateY(-2px) rotate(-8deg) scale(1.15)}nav button.on .ic{animation:pop .5s}@keyframes pop{40%{transform:scale(1.4) rotate(10deg)}}
.em{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 22%,transparent),color-mix(in srgb,var(--ac2) 22%,transparent));margin-right:8px;font-size:1rem;transition:.3s}.card:hover .em{transform:rotate(-10deg) scale(1.15)}
.pg i{background:linear-gradient(90deg,var(--ac2),var(--ac),var(--ac2));background-size:200% 100%;animation:sm 3s linear infinite}@keyframes sm{to{background-position:-200% 0}}
.run{animation:br 2s ease-in-out infinite;color:var(--ac2)}@keyframes br{50%{transform:scale(1.04);text-shadow:0 0 18px var(--ac2)}}
input[type=checkbox]{accent-color:var(--ac2);width:20px;height:20px}
body.cur,body.cur *{cursor:none!important}
#cd,#cr{position:fixed;left:0;top:0;pointer-events:none;z-index:100;opacity:0}
#cd{width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--ac)}
#cr{width:36px;height:36px;margin:-18px;border:1.5px solid var(--ac);border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:var(--ac);transition:width .25s,height .25s,margin .25s,background .25s,border-color .25s}
#cr::after{content:attr(data-l)}
#cr.h{width:54px;height:54px;margin:-27px;background:color-mix(in srgb,var(--ac) 14%,transparent)}
#cr.t{width:3px;height:28px;margin:-14px -1.5px;border-radius:2px;background:var(--ac2);border-color:var(--ac2)}#cr.t::after{content:""}
#cr.v{width:72px;height:72px;margin:-36px;background:var(--ac);color:#fff}
#cr.x{width:60px;height:60px;margin:-30px;border-color:#d33;color:#d33;background:#d331}
#cr.k{animation:ck .3s}@keyframes ck{50%{scale:.7}}
@media (max-width:640px){nav{justify-content:flex-start}nav button{flex-direction:column;gap:2px;padding:7px 10px;border-radius:14px;min-width:66px;font-size:.7rem;text-align:center}}
#auth{position:fixed;inset:0;z-index:90;display:grid;place-items:center;overflow:auto;padding:16px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px)}
#cr:not(.h):not(.x):not(.v):not(.t){width:12px;height:12px;margin:-6px;opacity:.35!important}
#ci{position:fixed;left:0;top:0;pointer-events:none;z-index:101;font-size:24px;line-height:1;opacity:0;filter:drop-shadow(0 2px 4px #0004)}#ci>*{display:block;animation:bb 2s ease-in-out infinite}
@keyframes bb{50%{transform:translateY(-3px)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes wr{50%{transform:rotate(-14deg) translateX(3px)}}@keyframes cn{to{transform:rotateY(360deg)}}@keyframes pp{50%{transform:scale(1.2)}}@keyframes ink{50%{transform:scale(.7) rotate(-20deg)}}
#ci.a-diary>*{animation:wr 1.2s ease-in-out infinite;transform-origin:0 100%}#ci.a-money>*{animation:cn 2.2s linear infinite}#ci.a-shop>*{animation:bb 1s ease-in-out infinite}#ci.a-timer>*{animation:sp 6s linear infinite}#ci.a-set>*{animation:sp 4s linear infinite}#ci.a-goals>*{animation:pp 1.4s infinite}#ci.k>*{animation:ink .3s}
</style></head><body>
<main>
<header><h1>📒 My Daily Desk · আমার দিনলিপি</h1><div id="clk">--:--</div></header>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<div id="ring"><div><div style="font-size:3rem">⏰</div><h2 id="rmsg"></h2><button class="btn p" onclick="stopRing()">OK, I’m on it! · ঠিক আছে</button></div></div>
<div id="mic"><button onclick="mic()" title="Voice assistant">🎤</button><button id="vlb" onclick="vl=vl=='en-US'?'bn-BD':'en-US';this.textContent=vl=='en-US'?'EN':'বাং'">EN</button></div><div id="pa"></div>
<script>
const $=id=>document.getElementById(id);
const CATS={Course:"#6a5acd",Film:"#e0603a",Teaching:"#2f7d6d",Shop:"#c28a00",Social:"#d6336c",Other:"#6b7280",Rest:"#38a3a5"};
const TABS=[["today","Today · আজ"],["tasks","Tasks · কাজ"],["timer","Timer · সময়"],["diary","Diary · ডায়েরি"],["stats","Stats · হিসাব"],["money","Money · টাকা"],["set","Settings · সেটিং"]];
const TIPS=["Lip-sync: animate the vowels’ jaw shapes first (A, O, U, M/B/P), then add tongue and teeth later.","Record yourself saying the line on your phone and study your own mouth in a mirror frame by frame.","Hit the key sounds only: lip sync works best on strong consonants (M, B, P, F) and open vowels. Don’t animate every letter.","Open the mouth 1–2 frames BEFORE the sound is heard so it feels natural.","Add head tilts, blinks and eyebrow moves. Good lip-sync is mostly face acting, not just the mouth.","Finish a rough blocking version first. Polish only after the timing feels right.","Study 1 minute of a favorite film scene every day and note where the mouth shapes change."];
const DEF={tasks:[{id:1,n:"Lip-sync assignment",c:"Course",m:90,p:3,d:0},{id:2,n:"Work on our film",c:"Film",m:60,p:2,d:0},{id:3,n:"Post on Facebook / Instagram",c:"Social",m:20,p:1,d:0}],plan:{},log:{},rest:{},diary:{},alarms:[],wt:null,rt:null,tab:"today",money:{pin:null,tx:[],budget:0},goals:[],dues:[],prac:[],imgs:[],posts:[],shop:[],stock:[],set:{free:"13:30",end:"22:00",madS:"09:00",madE:"13:00",shop:false,shopS:"17:00",shopE:"20:00",goal:"Finish my animation course",aim:"Make our film",restGoal:60}};
let UK=null,S=JSON.parse(JSON.stringify(DEF));
S.set=Object.assign({},DEF.set,S.set);
const save=()=>{try{UK&&localStorage.setItem(UK,JSON.stringify(S))}catch(e){try{toast("⚠ Storage full – delete old images or download a backup")}catch(x){}}};
const td=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const toM=t=>{const[a,b]=t.split(":");return +a*60+ +b};
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const hm=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const dur=s=>{s=Math.round(s);return Math.floor(s/3600)+"h "+String(Math.floor(s%3600/60)).padStart(2,"0")+"m"};
const clock=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catOpts=sel=>Object.keys(CATS).filter(c=>c!="Rest").map(c=>`<option ${c==sel?"selected":""}>${c}</option>`).join("");
function dayLog(d){return S.log[d]||(S.log[d]={})}
function addLog(c,s){const l=dayLog(td());l[c]=(l[c]||0)+s;save()}
function workElapsed(){return S.wt?(Date.now()-S.wt.start)/1000:0}
function totals(d){const l=Object.assign({},S.log[d]||{});if(d==td()&&S.wt)l[S.wt.cat]=(l[S.wt.cat]||0)+workElapsed();return l}
function sum(o){return Object.values(o).reduce((a,b)=>a+b,0)}

/* ---------- alarms ---------- */
let ac,ringT;
function beep(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();[0,.35,.7,1.05].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=t%.7?880:660;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.3);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.3)})}catch(e){}}
function ring(msg){$("rmsg").textContent=msg;$("ring").style.display="grid";beep();clearInterval(ringT);ringT=setInterval(beep,4000);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}try{if(window.Notification&&Notification.permission=="granted")new Notification("⏰ "+msg)}catch(e){}}
function stopRing(){$("ring").style.display="none";clearInterval(ringT)}
const fired=new Set();
function checkAlarms(){const d=td(),m=nowM();
 (S.plan[d]||[]).forEach((p,i)=>{const k=d+"p"+i;if(m>=p.s&&m<p.s+3&&!fired.has(k)){fired.add(k);ring(p.rest?"Rest time! · বিশ্রামের সময়":"Time to start: "+p.n)}});
 S.alarms.forEach((a,i)=>{const k=d+"a"+i;if(a.on&&m>=toM(a.t)&&m<toM(a.t)+3&&!fired.has(k)){fired.add(k);ring(a.l||"Alarm")}});}

/* ---------- auto planner ---------- */
function autoPlan(){const st=S.set,busy=[{s:toM(st.madS),e:toM(st.madE)}];if(st.shop)busy.push({s:toM(st.shopS),e:toM(st.shopE)});busy.sort((a,b)=>a.s-b.s);
 let t=Math.max(toM(st.free),nowM()),end=toM(st.end),plan=[];
 const skip=x=>{busy.forEach(b=>{if(x>=b.s&&x<b.e)x=b.e});return x};
 const items=S.tasks.filter(x=>!x.d).sort((a,b)=>b.p-a.p);
 for(const k of items){let left=k.m;
  while(left>0){t=skip(t);const nb=busy.find(b=>b.s>t);let d=Math.min(left,(nb?nb.s:end)-t,end-t);if(d<10)break;
   plan.push({id:k.id,n:k.n,c:k.c,s:t,e:t+d});t+=d;left-=d;
   if(t+10<=end&&left<=0){plan.push({n:"Rest",c:"Rest",s:t,e:t+10,rest:1});t+=10}
   if(d<left&&nb&&t>=nb.s)continue;if(left>0&&t>=end)break}
  if(t>=end)break}
 S.plan[td()]=plan;fired.clear();save();render()}

/* ---------- views ---------- */
function nav(){$("nav").innerHTML=TABS.map(([k,l])=>`<button class="${S.tab==k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(t){if(t!="money")mu=false;S.tab=t;save();render()}
function render(){nav();$("view").innerHTML=V[S.tab]();if(S.tab=="diary")diaryInit();tick()}
const V={};
V.today=()=>{const d=td(),tot=totals(d),plan=S.plan[d]||[],nm=nowM(),done=S.tasks.filter(t=>t.d).length,all=S.tasks.length||1;
 const tip=TIPS[new Date().getDate()%TIPS.length];
 return `<div class="card"><h2>🎯 My goals · আমার লক্ষ্য</h2><div>⭐ Main goal: <b>${esc(S.set.goal)}</b></div><div>🎬 Right now: <b>${esc(S.set.aim)}</b></div><div class="mut" style="margin-top:6px">🔥 Streak: <b>${streak()} day(s)</b> · Tasks done ${done}/${S.tasks.length}</div><div class="pg"><i style="width:${done/all*100}%"></i></div>
 <div class="row" style="margin-top:8px"><input class="grow" placeholder="⚡ Quick add task… press Enter" onkeydown="if(event.key=='Enter'&&this.value.trim()){S.tasks.push({id:Date.now(),n:this.value.trim(),c:'Other',m:30,p:2,d:0});save();render()}"></div><div class="mut" style="margin-top:8px">Worked today: <b id="wtot">${dur(sum(tot))}</b> · Rest: <b id="rtot"></b></div></div>
 <div class="card"><h2>🗓 Today’s plan · আজকের রুটিন</h2><div class="row"><button class="btn p" onclick="autoPlan()">✨ Auto-set my time</button><span class="mut">Fits your tasks into free time, with rests. ${esc(S.set.madS)}–${esc(S.set.madE)} is kept for teaching.</span></div>
 <div class="tl" style="--c:${CATS.Teaching}"><b>${S.set.madS}–${S.set.madE}</b> Madrasha teaching · মাদ্রাসা</div>
 ${plan.map((p,i)=>`<div class="tl ${p.e<=nm?"done":""} ${p.s<=nm&&nm<p.e?"now":""}" style="--c:${CATS[p.c]}"><b>${hm(p.s)}–${hm(p.e)}</b><span class="grow">${esc(p.n)}</span>${p.rest?"":`<button class="btn g" onclick="startWork('${p.c}')">▶</button>`}</div>`).join("")||'<p class="mut">No plan yet. Add tasks, then press Auto-set.</p>'}</div>
 <div class="card"><h2>💡 Animation tip of the day</h2><div class="f-kalam" style="font-size:1.15rem">${tip}</div></div>`};
V.tasks=()=>`<div class="card"><h2>📝 Add a task · নতুন কাজ</h2><div class="row"><input id="tn" class="grow" placeholder="Task / কাজের নাম"><select id="tc">${catOpts("Course")}</select><input id="tm" type="number" min="5" step="5" value="45" style="width:80px" title="minutes"><select id="tp"><option value="3">High</option><option value="2" selected>Medium</option><option value="1">Low</option></select><button class="btn p" onclick="addTask()">Add</button></div></div>
 <div class="card"><h2>My list</h2>${S.tasks.map(t=>`<div class="tk ${t.d?"d":""}"><input type="checkbox" ${t.d?"checked":""} onchange="togTask(${t.id})"><span class="t grow">${esc(t.n)}</span><span class="chip" style="--c:${CATS[t.c]}">${t.c}</span><span class="mut">${t.m}m</span><button class="btn" onclick="delTask(${t.id})">✕</button></div>`).join("")||'<p class="mut">Empty.</p>'}<div class="row" style="margin-top:8px"><button class="btn" onclick="S.tasks=S.tasks.filter(t=>!t.d);save();render()">Clear finished</button><button class="btn" onclick="S.tasks.forEach(t=>t.d=0);save();render()">New day: uncheck all</button></div></div>`;
function addTask(){const n=$("tn").value.trim();if(!n)return;S.tasks.push({id:Date.now(),n,c:$("tc").value,m:+$("tm").value||30,p:+$("tp").value,d:0});save();render()}
function togTask(id){const t=S.tasks.find(x=>x.id==id);t.d=t.d?0:1;save();render();if(t.d)burst()}
function delTask(id){S.tasks=S.tasks.filter(t=>t.id!=id);save();render()}

/* cursor per tab */
const SHOPK="<svg viewBox='0 0 32 32' width='30' height='30'><path d='M3 11l3-7h20l3 7z' fill='#e0603a'/><path d='M3 11h26' stroke='#fff' stroke-width='1.5' stroke-dasharray='4 3'/><circle cx='16' cy='17' r='4' fill='#f3c9a0'/><path d='M12 15a4 4 0 0 1 8 0z' fill='#2f7d6d'/><path d='M8 30c0-6 3.5-9 8-9s8 3 8 9z' fill='#2f7d6d'/><path d='M12 30v-6h8v6z' fill='#fff'/></svg>";
const CI={today:'📅',tasks:'✅',goals:'🎯',timer:'⏱️',diary:'🖋️',create:'🎨',shop:SHOPK,money:'💰',stats:'📊',set:'⚙️'};
function spark(t,x,y){const e=document.createElement('div');e.textContent=t;e.style.cssText=`position:fixed;left:${x}px;top:${y}px;z-index:99;pointer-events:none;font-size:1.2rem;transition:.8s ease-out`;document.body.appendChild(e);setTimeout(()=>{e.style.transform=`translate(${(Math.random()-.5)*60}px,-60px)`;e.style.opacity=0},20);setTimeout(()=>e.remove(),900)}
if(matchMedia('(pointer:fine)').matches){const ci=document.createElement('div');ci.id='ci';document.body.appendChild(ci);let last='';
 addEventListener('mousemove',e=>{ci.style.opacity=1;const d=S.tab=='diary';ci.style.transform=`translate(${e.clientX+(d?2:10)}px,${e.clientY+(d?-24:10)}px)`;if(last!=S.tab){last=S.tab;ci.className='a-'+S.tab;ci.innerHTML=`<span>${CI[S.tab]||'•'}</span>`}},{passive:true});
 addEventListener('mousedown',e=>{ci.classList.add('k');setTimeout(()=>ci.classList.remove('k'),300);const s={money:'🪙',shop:'🛍️',diary:'✨',goals:'⭐',tasks:'✔️'}[S.tab];if(s)spark(s,e.clientX,e.clientY)});
 document.addEventListener('mouseleave',()=>ci.style.opacity=0)}
(function(){if(!U().length&&localStorage.getItem('daydesk')){try{const d=JSON.parse(localStorage.getItem('daydesk'));d.prof={done:1,roles:['Animator','Teacher'],tabs:ALL.slice(),fixed:'Madrasha teaching · মাদ্রাসা'};localStorage.setItem('dd_data_1',JSON.stringify(d));setU([{id:1,name:'Me',av:'🙂',pin:null}])}catch(e){}}})();

/* ---------- tick ---------- */
function tick(){const d=new Date();$("clk").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
 if(S.rt&&(Date.now()-S.rt.start)/1000>=S.rt.len){const l=S.rt.len;stopRest(true);S.rest[td()]=S.rest[td()]||0;ring("Rest over! Back to work · বিশ্রাম শেষ");render()}
 checkAlarms();
 const g=id=>$(id);
 if(g("wclk")){g("wclk").classList.toggle("run",!!S.wt);g("wclk").textContent=S.wt?clock(workElapsed()):"00:00";g("wb").textContent=S.wt?"⏹ Stop ("+S.wt.cat+")":"▶ Start"}
 if(g("rclk")){const left=S.rt?Math.max(0,S.rt.len-(Date.now()-S.rt.start)/1000):0;g("rclk").classList.toggle("run",!!S.rt);g("rclk").textContent=clock(left);g("rinfo").textContent="Rest today: "+dur((S.rest[td()]||0)+(S.rt?S.rt.len-left:0))+" / "+S.set.restGoal+" min goal"}
 if(g("wtot")){g("wtot").textContent=dur(sum(totals(td())))}
 if(g("rtot"))g("rtot").textContent=dur(S.rest[td()]||0)}
setInterval(tick,1000);setInterval(()=>{if(S.tab=="today"&&!document.activeElement.matches("input,textarea,select"))render()},60000);
render();
</script></body></html>
